[project]
name = "comfyui-h3forge"
version = "0.3.0"
description = "H3-native sparse attention, FETA-style enrichment, and synchronized A/V context windows for ComfyUI MiniMax-H3"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.urls]
Repository = "https://github.com/RationallyPrime/ComfyUI-H3Forge"
Issues = "https://github.com/RationallyPrime/ComfyUI-H3Forge/issues"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
