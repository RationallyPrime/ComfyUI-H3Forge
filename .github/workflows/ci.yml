name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "torch>=2.8,<2.9" "pytest>=8,<9" "ruff>=0.12,<0.13"
      - run: ruff check .
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall -q .
